server {
    listen 80;
    server_name qurl.sh cupload.io;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://qurl.sh$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name qurl.sh cupload.io;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/qurl.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qurl.sh/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # Redirect cupload.io to qurl.sh
    if ($host = cupload.io) {
        return 301 https://qurl.sh$request_uri;
    }

    client_max_body_size 500M;
    client_body_timeout 600s;

    # Stream the request body to the upstream as it arrives instead of
    # buffering the whole upload to nginx's disk first. Required for the
    # app's chunked streaming write to actually help on large uploads.
    proxy_request_buffering off;
    proxy_http_version 1.1;

    # Prometheus scrape endpoint — internal only.
    # Scrapers should hit cupload:8080/metrics directly on the docker network.
    location = /metrics {
        return 404;
    }

    location / {
        # Use Docker's embedded DNS resolver
        resolver 127.0.0.11 valid=30s;
        set $upstream_app cupload;
        proxy_pass http://$upstream_app:8080;

        proxy_set_header    Host                $http_host;
        # Cloudflare Real IP Handling
        proxy_set_header    X-Real-IP           $http_cf_connecting_ip;
        proxy_set_header    X-Forwarded-For     $http_cf_connecting_ip;
        proxy_set_header    X-Forwarded-Proto   https;

        # Long-running uploads/downloads. Slow clients on a 500MB file
        # easily exceed the 60s default.
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Fallback if not Cloudflare (optional, but good for local dev)
        # If CF header is empty, Nginx might send empty.
        # A robust setup uses map, but for this specific user request:
        # We assume CF is always usually present or we rely on standard behavior if not.
        # Ideally, we pass it through so Flask checks it.
    }
}
